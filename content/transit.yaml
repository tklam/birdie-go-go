# Transit (SPEC.md §4.11). Paths are world-pixel waypoints from the first stop
# to the last; rides run them either way. Timetables: each terminus sends a
# vehicle every `headway` in-game minutes from `first` to `last` ("HH:MM";
# defaults 15, "06:00", "23:30").
stops:
  - { id: tko_plaza, name: Tseung Kwan O Plaza }
  - { id: po_toi_o_village, name: Po Toi O Village }
  - { id: tko_pier, name: Junk Bay Pier }
  - { id: po_toi_o_pier, name: Po Toi O Pier }
  - { id: cwb_park_gate, name: Country Park Gate }
  - { id: island_pier, name: Harbour Island Pier }
  - { id: tram_western, name: Western Tram Stop }
  - { id: tram_central, name: Central Tram Stop }
  - { id: tram_eastern, name: Eastern Tram Stop }
  - { id: tko_station, name: Tseung Kwan O Station }
  - { id: island_station, name: Harbour Island Station }
lines:
  - id: minibus_16
    name: Green Minibus 16
    mode: bus
    fare: 8
    stops: [tko_plaza, cwb_park_gate, po_toi_o_village]
