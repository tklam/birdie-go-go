# Transit (SPEC.md §4.11). Paths are world-pixel waypoints from the first stop
# to the last; rides run them either way. Timetables: each terminus sends a
# vehicle every `headway` in-game minutes from `first` to `last` ("HH:MM";
# defaults 15, "06:00", "23:30"). `speed` is px per in-game minute; the map
# clock runs game.yaml `clock_rate` minutes a second, so on screen a vehicle
# moves speed × clock_rate px a second. `bell` is the sound cue (sounds.yaml) a
# vehicle makes leaving a stop and passing Angie.
