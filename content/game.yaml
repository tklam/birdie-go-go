title: Birdie Go Go
content_version: 0.1.0
start_map: world
start_spawn: estate_plaza
# Every this many time slots, a toast reminds you of an active mission (0 = never).
mission_reminder_slots: 3
# In the evening, away from home, a toast every this many seconds of play
# suggests heading home to sleep (0 = never). The lines take turns.
bedtime_reminder:
  every_seconds: 90
  lines:
    - "It's getting late. Time to head home and rest."
    - "Angie yawns. Her bed at home is calling."
    - "The streetlights are on. Home to sleep, then a new day!"
# Everyday Energy costs (SPEC.md §4.12). One in-game minute is one real
# second while exploring. Sleep restores Energy fully; food restores some.
# The in-game clock: minutes per real second on the map and while riding
# (5 real minutes an hour). Energy, hazard and transit rates are per in-game
# minute, so they're tuned to it.
clock_rate: 0.2
energy:
  walk_per_min: 0.25
  indoor_recovery_per_min: 0.5
  photo_session: 12
  lesson: 10
  low_warning: 25
  low_warning_text: "Angie's tummy rumbles. Time for a snack from the shop!"
  too_tired_text: "Angie is too tired. Eat something or rest first."
  # No game over (SPEC.md §4.12): at 0 Energy a neighbour helps Angie home.
  # She pays up to `fee` ({fee} in a line is the amount) and wakes with
  # `recover_to` Energy. One notice for the weather, one for a lost encounter.
  faint:
    fee: 50
    recover_to: 60
    weather:
      title: "You feel dizzy..."
      lines:
        - "Angie sat down, exhausted by the weather."
        - "A kind neighbour helped her home. (-${fee})"
        - "Pack the right gear next time!"
    encounter:
      title: "That was too much..."
      lines:
        - "Angie is worn out from the chase."
        - "A kind neighbour helped her home. (-${fee})"
        - "Sneak past, or rest before the next one!"
# Paid each morning they're due (every_days: 1 = daily). Money never goes below 0.
bills:
  - { name: Electricity, amount: 12 }
  - { name: Phone, amount: 6 }
  - { name: Water and gas, amount: 8, every_days: 2 }
  - { name: Rent, amount: 150, every_days: 7 }
# The rechargeable fare card (SPEC.md §4.11): topped up at shops and stop kiosks.
transit_card: { name: Harbour Pass, start_balance: 50, top_up: 50 }
# How many bought supplies (snacks, drinks, sunscreen, …) fit in the bag; the rest wait in the cupboard at home.
bag_capacity: 8
