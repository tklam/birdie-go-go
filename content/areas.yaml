# Districts of the world (SPEC.md §4.3). Shapes are painted on the world's `areas` layer.
# climate: per season, [mean, variability] per weather parameter (SPEC.md §4.9),
# loosely after Hong Kong: humid foggy springs, hot showery summers with
# typhoons, clear dry autumns, cool dry winters.
# walk_effort (optional, default 1) multiplies the Energy that walking costs.
- id: tko_town
  name: Tseung Kwan O Town Centre
  music: bgm_town
  altitude: 0.05
  climate:
    spring: { cloud: [0.65, 0.2], precip: [0.03, 0.2], temp: [22, 2.5], fog: [0.25, 0.2], wind: [0.3, 0.2] }
    summer: { cloud: [0.5, 0.3], precip: [0.06, 0.22], temp: [31, 1.5], fog: [0.02, 0.05], wind: [0.3, 0.25] }
    autumn: { cloud: [0.3, 0.2], precip: [0.0, 0.12], temp: [25, 2.5], fog: [0.05, 0.05], wind: [0.3, 0.2] }
    winter: { cloud: [0.45, 0.2], precip: [0.0, 0.1], temp: [16, 2.5], fog: [0.1, 0.1], wind: [0.4, 0.2] }
