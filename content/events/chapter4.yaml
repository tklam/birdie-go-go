# Chapters 4–5, the finale and the epilogue (SPEC.md §8).
- id: chapter4_start
  trigger: { type: day_start }
  conditions:
    - kei_stage: friends
    - bond_at_least: { who: kei, amount: 20 }
    - flag_not_set: chapter4_started
  actions:
    - set_chapter: 4
    - set_flag: chapter4_started
    - dialogue: kei_invite
    - start_mission: date_po_toi_o

- id: first_date
  trigger: { type: mission_complete, mission: date_po_toi_o }
  actions:
    - dialogue: first_date
    - set_kei_stage: dating
    - add_bond: { who: kei, amount: 15 }

- id: oboy_accepts_kei
  trigger: { type: photo_session_end }
  conditions:
    - kei_stage: dating
    - party_has: oboy
    - party_has: kei
    - bond_at_least: { who: oboy, amount: 50 }
    - flag_not_set: oboy_accepts_kei
  actions:
    - dialogue: oboy_accepts_kei
    - set_flag: oboy_accepts_kei
    - add_bond: { who: kei, amount: 5 }

- id: chapter5_start
  trigger: { type: day_start }
  conditions:
    - kei_stage: dating
    - flag_set: oboy_accepts_kei
    - flag_not_set: chapter5_started
  actions:
    - set_chapter: 5
    - set_flag: chapter5_started
    - dialogue: chapter5_contest
    - start_mission: harbour_contest
    - start_mission: mei_big_recital

- id: kei_proposes
  trigger: { type: mission_complete }
  conditions:
    - flag_set: "mission_done:harbour_contest"
    - flag_set: "mission_done:mei_big_recital"
    - flag_not_set: kei_proposed
  actions:
    - set_flag: kei_proposed
    - dialogue: kei_proposes
    - set_kei_stage: engaged

- id: wedding
  trigger: { type: day_start }
  conditions:
    - kei_stage: engaged
    - flag_not_set: wedding_done
  actions:
    - set_flag: wedding_done
    - dialogue: wedding
    - set_kei_stage: married
    - set_chapter: 6

# Kei's gateways (SPEC.md §4.11): teleports linking the real world with his digital realm.
- id: kei_gateways
  trigger: { type: day_start }
  conditions:
    - kei_stage: dating
    - bond_at_least: { who: kei, amount: 45 }
    - flag_not_set: gateways_online
  actions:
    - dialogue: kei_gateways
    - set_flag: gateways_online
    - set_flag: "gateway:tko_plaza"
    - set_flag: "gateway:cwb_park"
    - set_flag: "gateway:po_toi_o"

# The morning after the wedding: life together, and the open city (post-game).
- id: epilogue
  trigger: { type: day_start }
  conditions:
    - flag_set: wedding_done
    - flag_not_set: epilogue_done
  actions:
    - set_flag: epilogue_done
    - dialogue: epilogue
