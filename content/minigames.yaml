- id: farm_quiz_game
  type: quiz
  title: "Farm Quiz"
  intro: "He leans on his hoe. \"Now then.\""
  target: 2
  quiz:
    - question: "What makes wet fields good for birds?"
      answers: ["They're quiet", "Frogs, insects and worms", "Bird feeders"]
      correct: 1
    - question: "Which crop grows in water?"
      answers: ["Watercress", "Potatoes", "Corn"]
      correct: 0
    - question: "Which bird stalks the fields like a little heron?"
      answers: ["Cattle Egret", "Black Kite", "Tree Sparrow"]
      correct: 0
