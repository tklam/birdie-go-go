# Mini games for place stories and favours (SPEC.md §4.14). Types: quiz,
# memory, rhythm, catch, find, slide. Icons: "bird:<species>" or "prop:<name>".
- id: junk_bay_quiz
  type: quiz
  title: Junk Bay Quiz
  intro: "Uncle Lam taps his pipe. \"Let's see if you were listening, young lady.\""
  target: 2
  quiz:
    - question: "How did Junk Bay get its name?"
      answers: ["Junks sheltered here from storms", "It was full of rubbish", "A sea captain called Junk"]
      correct: 0
    - question: "What was built on the land reclaimed from the bay?"
      answers: ["A racecourse", "A new town", "An airport"]
      correct: 1
    - question: "What did Uncle Lam's family do before the new town?"
      answers: ["Farmed rice", "Built ships", "Fished from their boat"]
      correct: 2

- id: new_town_photo_game
  type: slide
  title: "Moving Day Photo"
  intro: "Mrs Chan hands you the pieces. \"Careful, that's my mother's smile in the corner.\""
  image: bg_garden_far
  size: 3
- id: hill_village_birds_game
  type: find
  title: "Birds of the Old Village"
  intro: "He points his walking stick at the trees. \"There, and there. Can you see them?\""
  icons: ["bird:red_whiskered_bulbul", "bird:oriental_magpie_robin", "bird:spotted_dove", "bird:masked_laughingthrush", "bird:grey_treepie", "bird:black_kite"]
  target: 5
  seconds: 60
- id: park_ranger_count_game
  type: memory
  title: "Survey Cards"
  intro: "Ranger Ho spreads the cards face down on a picnic table."
  icons: ["bird:oriental_magpie_robin", "bird:red_whiskered_bulbul", "bird:great_barbet", "bird:blue_whistling_thrush", "bird:fork_tailed_sunbird", "bird:hwamei"]
  pairs: 6
- id: sea_goddess_drum_game
  type: rhythm
  title: "Festival Drum"
  intro: "The keeper hands you two heavy sticks. \"Strong and steady. The lion dances to you.\""
  target: 14
  tempo: 92
  pattern: [0, 1, 2, 3, 4, 5, 6, 6.5, 7, 8, 9, 10, 10.5, 11, 12, 13, 14, 14.5, 15, 16]
- id: tram_history_quiz_game
  type: quiz
  title: "Tram Quiz"
  intro: "He rings an imaginary bell. \"Question one!\""
  target: 2
  quiz:
    - question: "What do people call the trams, from their bell?"
      answers: ["Ding-ding", "Toot-toot", "Clang"]
      correct: 0
    - question: "How long have trams run along this shore?"
      answers: ["Ten years", "Over a hundred years", "Since last spring"]
      correct: 1
    - question: "Why is the harbour further from the tracks now?"
      answers: ["The sea dried up", "The tracks moved", "Land was reclaimed"]
      correct: 2
- id: peak_raptors_game
  type: find
  title: "Raptors on the Wind"
  intro: "Uncle Chan shades his eyes. \"Up there. And there. Find them all.\""
  icons: ["bird:crested_serpent_eagle", "bird:black_kite", "bird:peregrine_falcon", "bird:crested_goshawk", "bird:common_kestrel"]
  target: 4
  seconds: 50
- id: shrimp_harvest_game
  type: catch
  title: "Shrimp Harvest"
  intro: "The keeper hands you a woven basket. \"Shrimp yes, rubbish no!\""
  icons: ["prop:shrimp", "prop:fish"]
  avoid: ["prop:can", "prop:bag"]
  target: 15
  seconds: 40
- id: bun_festival_game
  type: catch
  title: "Bun Rush"
  intro: "Steam everywhere. \"Catch the buns! Not the lanterns, those are for the parade!\""
  icons: ["prop:bun"]
  avoid: ["prop:lantern"]
  target: 18
  seconds: 40
- id: beach_cleanup_game
  type: catch
  title: "Beach Clean-Up"
  intro: "She hands you gloves and a sack. \"Litter in, shells out!\""
  icons: ["prop:can", "prop:bottle", "prop:bag"]
  avoid: ["prop:shell", "prop:crab"]
  target: 15
  seconds: 40
- id: seafood_sort_game
  type: memory
  title: "Sort the Catch"
  intro: "Auntie flips the tank labels over. \"Two of each, quick!\""
  icons: ["prop:fish", "prop:shrimp", "prop:crab", "prop:shell", "prop:junk"]
  pairs: 5
- id: volcano_quiz_game
  type: quiz
  title: "Volcano Quiz"
  intro: "She taps a column with her hammer. \"Pop quiz!\""
  target: 2
  quiz:
    - question: "What shape are the rock columns?"
      answers: ["Squares", "Hexagons", "Circles"]
      correct: 1
    - question: "What made them?"
      answers: ["Cooling volcanic ash", "Ancient builders", "Waves"]
      correct: 0
    - question: "Which bird loves these cliffs?"
      answers: ["Little Egret", "Blue Rock Thrush", "Tree Sparrow"]
      correct: 1
